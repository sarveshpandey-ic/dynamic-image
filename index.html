<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Image Generator</title>
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body style="font-family: sans-serif; max-width: 800px; margin: auto; padding: 40px; text-align: center;">

  <h1>🖼️ Dynamic Image Creator</h1>

  <!-- Image Upload -->
  <button id="upload_widget" class="cloudinary-button" style="padding: 10px 20px; font-size: 16px;">Upload Image</button>
  <p>Uploaded Image URL: <span id="uploaded-url" style="font-weight: bold;"></span></p>

  <!-- Text Inputs -->
  <h3 style="margin-top: 40px;">Text Template</h3>
  <input type="text" id="fixedText" placeholder="Fixed text (e.g., Hey)" value="Hey"
         style="padding: 8px; font-size: 16px; width: 200px;" />
  <input type="text" id="dynamicKey" placeholder="Dynamic key (e.g., name)" value="name"
         style="padding: 8px; font-size: 16px; width: 200px;" />
  <br><br>
  <button onclick="generateFinalURL()" style="padding: 10px 20px; font-size: 16px;">Generate Dynamic URL</button>

  <!-- Final Result -->
  <div style="margin-top: 30px;">
    <p><strong>Final Image URL:</strong></p>
    <a id="final-url" href="#" target="_blank" style="word-break: break-all;"></a>
  </div>

  <script>
    const cloudName = 'duhcp5u5p';
    let uploadedPublicId = '';

    // Cloudinary Upload Widget
    const uploadWidget = cloudinary.createUploadWidget({
      cloudName: cloudName,
      uploadPreset: 'unsigned' // You can use an unsigned preset from your Cloudinary dashboard
    }, (error, result) => {
      if (!error && result && result.event === "success") {
        uploadedPublicId = result.info.public_id;
        const uploadedURL = result.info.secure_url;
        document.getElementById("uploaded-url").textContent = uploadedURL;
      }
    });

    document.getElementById("upload_widget").addEventListener("click", function () {
      uploadWidget.open();
    }, false);

    // Generate Final URL with Text Overlay
    function generateFinalURL() {
      const dynamicKey = document.getElementById('dynamicKey').value || "name";
      const nameParam = `{${dynamicKey}}`;
      const fixed = document.getElementById('fixedText').value || "";
      const fullText = `${fixed} ${nameParam}`;
      
      if (!uploadedPublicId) {
        alert("Please upload an image first.");
        return;
      }

      const cloudinaryBase = `https://res.cloudinary.com/${cloudName}/image/upload`;

      // White background box behind text (800x200), text centered
      const overlay = `l_text:Arial_60_bold:${encodeURIComponent(fullText)},g_center,co_rgb:000000,c_fit,w_800,h_200,b_white`;

      const finalURL = `${cloudinaryBase}/${overlay}/${uploadedPublicId}.jpg`;

      const link = document.getElementById('final-url');
      link.href = finalURL;
      link.textContent = finalURL;
    }
  </script>

</body>
</html>
