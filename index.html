<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Editor with Dynamic Text</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
    #canvas-container { border: 2px dashed #ccc; margin-top: 20px; }
    canvas { border: 1px solid #aaa; }
    .controls { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
    .controls input, .controls select, .controls button { padding: 8px; font-size: 14px; }
    #dropzone {
      border: 2px dashed #888;
      padding: 20px;
      text-align: center;
      background-color: #fff;
      margin-top: 20px;
    }
    .instruction {
      font-size: 12px;
      color: #666;
      margin-top: -10px;
      margin-bottom: 10px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>
  <h1>Image Editor with Dynamic Text</h1>

  <div id="dropzone">Drag and drop an image here or click to upload
    <input type="file" id="imageUploader" accept="image/*" style="display:none;" />
  </div>

  <div class="controls">
    <button onclick="addWhiteBox()">Add White Box</button>
    <label for="opacityRange">Opacity:</label>
    <input type="range" id="opacityRange" min="0" max="1" step="0.01" value="0.8" />
    <button onclick="deleteSelectedObject()">Delete Selected</button>
    <input type="text" id="textInput" placeholder="Type your text here (use {name} for dynamic)" />
  </div>
  <div class="instruction">Type your text here (use {name} for dynamic)</div>
  <div class="controls">
    <select id="fontFamily">
      <option value="Arial">Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Courier New">Courier</option>
    </select>
    <input type="number" id="fontSize" placeholder="Font size" value="20" />
    <button onclick="addTextBox()">Add Text</button>
    <button onclick="exportImage()">Export Image</button>
  </div>

  <div id="canvas-container">
    <canvas id="canvas" width="800" height="600"></canvas>
  </div>

  <script>
    const canvas = new fabric.Canvas('canvas');
    let dynamicTextBox = null;

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = function (f) {
        fabric.Image.fromURL(f.target.result, function (img) {
          canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
            scaleX: canvas.width / img.width,
            scaleY: canvas.height / img.height
          });
        });
      };
      reader.readAsDataURL(file);
    }

    const dropzone = document.getElementById("dropzone");
    const imageUploader = document.getElementById("imageUploader");

    dropzone.addEventListener('click', () => imageUploader.click());
    imageUploader.addEventListener('change', (e) => loadImage(e.target.files[0]));

    dropzone.addEventListener("dragover", function(e) {
      e.preventDefault();
      dropzone.style.background = "#e0e0e0";
    });

    dropzone.addEventListener("dragleave", function(e) {
      dropzone.style.background = "#fff";
    });

    dropzone.addEventListener("drop", function(e) {
      e.preventDefault();
      dropzone.style.background = "#fff";
      if (e.dataTransfer.files.length > 0) {
        loadImage(e.dataTransfer.files[0]);
      }
    });

    function addWhiteBox() {
      const opacity = parseFloat(document.getElementById('opacityRange').value);
      const rect = new fabric.Rect({
        left: 100,
        top: 100,
        fill: 'white',
        width: 300,
        height: 100,
        opacity: opacity,
        hasControls: true,
        lockRotation: false
      });
      canvas.add(rect);
    }

    function addTextBox() {
      const text = document.getElementById('textInput').value;
      const font = document.getElementById('fontFamily').value;
      const fontSize = parseInt(document.getElementById('fontSize').value, 10);

      const finalText = text.replace(/{(.*?)}/g, (_, key) => {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(key) || `{${key}}`;
      });

      const textbox = new fabric.Textbox(finalText, {
        left: 120,
        top: 120,
        fill: '#000000',
        fontFamily: font,
        fontSize: fontSize,
        fontWeight: 'normal',
        fontStyle: 'normal',
        editable: true
      });

      canvas.add(textbox);
      dynamicTextBox = textbox;
    }

    function deleteSelectedObject() {
      const activeObject = canvas.getActiveObject();
      if (activeObject) {
        canvas.remove(activeObject);
      }
    }

    function exportImage() {
      const dataURL = canvas.toDataURL({ format: 'png' });
      const blob = dataURItoBlob(dataURL);

      const cloudName = "duhcp5u5p";
      const uploadUrl = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;

      const formData = new FormData();
      formData.append("file", blob);
      formData.append("upload_preset", "unsigned_preset");

      fetch(uploadUrl, {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        const uploadedUrl = data.secure_url;

        const dynamicText = document.getElementById('textInput').value;
        const paramMatch = dynamicText.match(/{(.*?)}/);
        let exampleLink = uploadedUrl;
        if (paramMatch) {
          const key = paramMatch[1];
          exampleLink += `?${key}=John`;
        }

        const newWindow = window.open();
        newWindow.document.write(`<p>Image uploaded to Cloudinary!</p>`);
        newWindow.document.write(`<p>Use this link with UTM params:</p>`);
        newWindow.document.write(`<p><a href="${exampleLink}" target="_blank">${exampleLink}</a></p>`);
      })
      .catch(err => {
        console.error("Upload failed:", err);
        alert("Image upload failed. Check the console for details.");
      });
    }

    function dataURItoBlob(dataURI) {
      const byteString = atob(dataURI.split(',')[1]);
      const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      return new Blob([ab], { type: mimeString });
    }
  </script>
</body>
</html>
