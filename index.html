<!DOCTYPE html>
<html>
<head>
    <title>Image Personalizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        .toolbar { padding: 10px; background: #f0f0f0; }
        button { margin: 5px; padding: 8px; }
        canvas { border: 1px solid #ccc; margin: 20px; }
        .text-controls { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="toolbar">
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="addTextBox()">Add Text Box</button>
        
        <div class="text-controls">
            <select id="fontFamily" onchange="updateTextStyle()">
                <option value="Arial">Arial</option>
                <option value="Helvetica">Helvetica</option>
                <option value="Times New Roman">Times New Roman</option>
            </select>
            
            <input type="number" id="fontSize" value="20" min="10" max="72" 
                   onchange="updateTextStyle()" style="width: 60px;">
            
            <button onclick="toggleBold()">B</button>
            <button onclick="toggleItalic()">I</button>
        </div>
        
        <button onclick="exportImage()">Export Image</button>
    </div>

    <canvas id="canvas" width="800" height="600"></canvas>

    <script>
        let canvas = new fabric.Canvas('canvas');
        let dynamicParams = new URLSearchParams(window.location.search);

        // Image Upload
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(f) {
                fabric.Image.fromURL(f.target.result, function(img) {
                    img.scaleToWidth(800);
                    canvas.add(img).centerObject(img);
                });
            };
            reader.readAsDataURL(file);
        });

        // Add Text Box
        function addTextBox() {
            const text = new fabric.Textbox('Fixed Text | Dynamic: ' + getDynamicText(), {
                left: 100,
                top: 100,
                width: 400,
                fontSize: 20,
                backgroundColor: 'white',
                padding: 10,
                fontFamily: document.getElementById('fontFamily').value
            });
            
            canvas.add(text);
        }

        // Text Formatting
        function updateTextStyle() {
            const active = canvas.getActiveObject();
            if (active && active.isType('textbox')) {
                active.set({
                    fontFamily: document.getElementById('fontFamily').value,
                    fontSize: parseInt(document.getElementById('fontSize').value)
                });
                canvas.renderAll();
            }
        }

        function toggleBold() {
            const active = canvas.getActiveObject();
            if (active && active.isType('textbox')) {
                active.set('fontWeight', active.fontWeight === 'bold' ? 'normal' : 'bold');
                canvas.renderAll();
            }
        }

        function toggleItalic() {
            const active = canvas.getActiveObject();
            if (active && active.isType('textbox')) {
                active.set('fontStyle', active.fontStyle === 'italic' ? 'normal' : 'italic');
                canvas.renderAll();
            }
        }

        // Dynamic Text Handling
        function getDynamicText() {
            return dynamicParams.get('dynamicText') || 'DefaultValue';
        }

        // Export Functionality
        function exportImage() {
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1
            });
            
            const state = {
                canvas: canvas.toJSON(),
                params: Object.fromEntries(dynamicParams)
            };
            
            const shareUrl = `${window.location.origin}${window.location.pathname}?${btoa(JSON.stringify(state))}`;
            window.open(dataURL);
            prompt('Shareable URL (copy this):', shareUrl);
        }

        // Initialization
        window.onload = function() {
            try {
                const state = JSON.parse(atob(window.location.search.slice(1)));
                if (state.canvas) {
                    canvas.loadFromJSON(state.canvas, () => {
                        canvas.renderAll();
                    });
                }
            } catch(e) { /* Ignore invalid state */ }
        };
    </script>
</body>
</html>
